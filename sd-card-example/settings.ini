# RNode R8 ColorUI settings. Copy to the top folder of the SD card.
# Lines starting with # are ignored. Delete a line to use the default.

brand = Bluffs Reticulum Box     # boot splash title
theme = night                    # night, soft, amber, or retro (the 0.6 pixel look)
tz = -8                          # hours from UTC (Pacific standard = -8, daylight = -7)
clock = 12                       # 12 or 24

# Your LXMF address(es): shows "Message for you" cards and the QR code on
# the Status page. Copy it from MeshChatX / Sideband (32 hex characters).
# my_lxmf = 25f15e1a33ba6f37c61aad8f263f02c2

sounds = on                      # off = silence everything below
beep_area = on                   # chirp when you enter a new town
beep_node = off                  # chirp for every new node (busy!)
beep_message = on
beep_echo = on                   # chirp when your announce comes back through another node
beep_watch = on                  # chirp when a watch-list node (! in names.txt) shows up
notifications = on

brightness = 100                 # percent
screensaver_minutes = 5          # 0 = never
dim = 15                         # backlight percent while the screensaver runs

start_page = home                # home, heard, signal, channel, area, radios, status
privacy = off                    # on = hide names and positions at boot
log = on                         # write /logs/heard-YYYY-MM-DD.csv
sd_live = on                     # off = read the card only at boot (no map, no logs)
touch_flip = off                 # on if tapping the left rail picks the wrong page
touch_debug = off                # on = red dot where your touch lands

# Wi-Fi file manager: open http://<the board's IP> (shown on the Status page)
web = on
web_update = on                  # allow firmware updates from the web page
# web_password = pick-something        # user name is: rnode
