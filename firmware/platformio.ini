; RNode 1.86 + ColorUI -- Heltec WiFi LoRa 32 V4-R8 + Expansion Kit V2
; Arduino-ESP32 2.0.17 (the core upstream RNode pins), 16 MB flash, 8 MB octal PSRAM.
[env:heltec_v4_r8_colorui]
platform = espressif32@6.8.1
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions_16mb.csv
board_upload.maximum_size = 6291456
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -DBOARD_MODEL=0xF8
  -DCOLORUI
  -DBOARD_HAS_PSRAM
  -DCOLORUI_VERSION='"0.7"'
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps =
  adafruit/Adafruit SSD1306
  adafruit/Adafruit SH110X
  adafruit/Adafruit ST7735 and ST7789 Library
  adafruit/Adafruit NeoPixel
  lewisxhe/XPowersLib
  rweather/Crypto
  lovyan03/LovyanGFX@^1.1.16
  https://github.com/Quency-D/chsc6x/archive/5cbead829d6b432a8d621ed1aafd4eb474fd4f27.zip
extra_scripts = post:tools/set_firmware_hash.py
